# Codemagic CI — build the Capacitor iOS app and ship it to TestFlight
# WITHOUT owning a Mac. Codemagic runs the macOS build in the cloud and
# handles code signing via its App Store Connect integration (UI-configured).
#
# One-time setup in the Codemagic web UI (see MOBILE.md for the walkthrough):
#   1. Connect this GitHub repo.
#   2. Team settings → Integrations → App Store Connect → add an API key
#      (issuer id + key id + .p8). Name it "gastos_asc" (or edit below).
#   3. Add environment group "gastos_env" with:
#        VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY   (from your GitHub secrets)
#   4. Push to the branch and run this workflow.

workflows:
  ios-testflight:
    name: Gastos iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 45
    integrations:
      app_store_connect: gastos_asc
    environment:
      groups:
        - gastos_env
      vars:
        BUNDLE_ID: "com.brainpulp.gastos"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 22.x
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.brainpulp.gastos
    scripts:
      - name: Install JS dependencies
        script: npm ci
      - name: Build web assets (relative base for Capacitor)
        script: CAP_BUILD=1 npm run build
      - name: Add iOS platform if missing, then sync
        script: |
          npx cap add ios || true
          npx cap sync ios
      - name: Generate app icons from resources/icon.png
        script: npx @capacitor/assets generate --ios || true
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Install CocoaPods
        script: |
          cd ios/App && pod install
      - name: Build & archive .ipa
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Only you (the account holder) will see it — no external testers,
        # no App Store review, unless you add testers/groups here.
